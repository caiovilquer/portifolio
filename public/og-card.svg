<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Caio Vilquer, backend em Java, Kotlin e TypeScript, Poli-USP">
  <!--
    Card social. Fonte da verdade do og-card.png.
    O comando de regeneração do PNG está documentado no README.

    O emblema à direita repete a geometria de public/logos/caio-vilquer-emblema.svg.
  -->
  <rect width="1200" height="630" fill="#F2F0E6"/>
  <rect x="56" y="44" width="1088" height="542" fill="#fffef8" stroke="#0B3B3C" stroke-width="2"/>
  <path d="M56 122h1088M56 500h1088" fill="none" stroke="#57544C" stroke-width="2"/>
  <!-- marcas de registro nos cantos, curtas, para não cruzarem o texto -->
  <path d="M142 44v13M1058 44v13M142 573v13M1058 573v13" fill="none" stroke="#57544C" stroke-width="2"/>
  <path d="M56 108h1088" stroke="#8FE3D2" stroke-width="8"/>

