<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caio Vilquer">
  <!--
    Ladrilho de aba. Mesma geometria da marca, reduzida por fator 0,667
    (raio 27 vira 18) e com traço proporcionalmente mais pesado para
    sobreviver a 16px. Ângulo da diagonal e proporção de avanço idênticos
    ao lockup, para as duas marcas lerem como a mesma coisa.
  -->
  <rect width="64" height="64" fill="#142b3c"/>
  <g fill="none" stroke-linecap="square">
    <circle cx="32" cy="32" r="18" stroke="#fffef8" stroke-width="4"/>
    <path d="M42 11 22 53" stroke="#d4614a" stroke-width="4"/>
    <path d="M32 8v5M32 51v5M8 32h5M51 32h5" stroke="#9da29f" stroke-width="2.5"/>
    <path d="M40 10 44 13M20 52 24 54" stroke="#d4614a" stroke-width="2.5"/>
  </g>
</svg>
